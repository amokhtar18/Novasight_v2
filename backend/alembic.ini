# Alembic configuration for the Analytica control plane.
#
# NOTE: there is deliberately no `sqlalchemy.url` here. The database URL is the
# single source of truth in app.core.config (golden rule: no hardcoded infra).
# alembic/env.py builds it from get_settings().postgres.url at runtime. A url
# may still be injected programmatically (e.g. tests) via the Config object.

[alembic]
script_location = alembic
prepend_sys_path = .
# Migration filenames: zero-padded revision slug + human description.
file_template = %%(rev)s_%%(slug)s
version_path_separator = os

[post_write_hooks]
# Keep generated migrations lint-clean.
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
