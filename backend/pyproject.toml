[project]
name = "novasight-backend"
version = "0.1.0"
description = "NovaSight backend — managed data analytics & BI platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "redis>=5.0",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
    # Password hashing for the self-contained password-auth login (app/core/passwords.py).
    "bcrypt>=4.1",
    "aioboto3>=13.0",
    "python-multipart>=0.0.9",
    # Ingestion: dlt with filesystem + iceberg extras for CSV→Iceberg pipeline
    "dlt[filesystem,iceberg,parquet]>=1.27.2",
    # Iceberg table management via REST catalog; s3fs provides the FsspecFileIO
    "pyiceberg[s3fs]>=0.11.1",
    # Arrow columnar format used by both dlt's parquet path and pyiceberg writes
    "pyarrow>=14.0",
    # ClickHouse serving-tier client (HTTP) for registration DDL + read-only queries
    "clickhouse-connect>=0.8",
    # Anthropic SDK — used by the Anthropic LLM provider in app/ai/gateway/
    "anthropic>=0.50",
    # SQL parser — validates generated SQL (read-only check, allow-list, tenant isolation)
    "sqlglot>=25.0",
    # Model Context Protocol SDK — powers the standalone FastMCP server (app/mcp/)
    # that re-exposes the grounded chat tools to external MCP clients (#11/#12 tail).
    "mcp>=1.2",
    # Background jobs: Dramatiq actors on the same Redis the app already uses, with
    # periodiq as the cron-style scheduler (Phase 5 reporting + KPI alerts). The
    # Redis client comes from the top-level ``redis`` dependency above (not the
    # ``dramatiq[redis]`` extra, which pins an older redis-py than the app uses).
    "dramatiq>=1.16",
    "periodiq>=0.13",
    # Excel rendering for scheduled reports.
    "xlsxwriter>=3.2",
    # Observability (Phase 6.4): Prometheus metrics + OpenTelemetry tracing. The OTLP
    # exporter endpoint and toggles come from settings (golden rule 1).
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "anyio>=4.0",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "ANN",  # flake8-annotations (enforce type hints)
    "S",    # flake8-bandit (security)
    "RUF",  # ruff-native rules
]
# TCH (type-checking imports) is omitted: pydantic field types like SecretStr must
# be available at runtime; moving them into TYPE_CHECKING blocks would break them.
ignore = [
    "S101",    # use of assert — allowed in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert is fine in tests
    "ANN",     # no annotation enforcement in tests
    "S608",    # SQL injection false-positives in test fixtures (controlled test strings)
    "S105",    # hardcoded passwords are test secrets, not production credentials
    "S106",    # hardcoded password kwargs in test fixtures are test secrets
    "S107",    # hardcoded password defaults in test helpers are test secrets
]
# Alembic migrations are generated/boilerplate: long DDL lines and the Alembic
# import-ordering idiom are expected and not worth fighting.
"alembic/versions/*.py" = [
    "E501",    # DDL column definitions run long
    "ANN",     # revision identifier module vars need no annotations beyond given
]
"alembic/env.py" = [
    "E402",    # imports follow Alembic's config bootstrap by design
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
# pydantic-settings generates __init__ signatures that mypy can't see without the plugin
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "pydantic_settings.*"
ignore_missing_imports = true

# aioboto3 / aiobotocore ship no type information; the S3 client is created and
# called dynamically, so its surface is opaque to mypy. We isolate that to the
# object-store adapter and treat the import as untyped here.
[[tool.mypy.overrides]]
module = "aioboto3.*"
ignore_missing_imports = true

# pyiceberg ships no py.typed marker; treat all imports as untyped.
[[tool.mypy.overrides]]
module = "pyiceberg.*"
ignore_missing_imports = true

# pyarrow ships stubs but some sub-modules (pyarrow.csv) are not fully exported.
[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true
no_implicit_reexport = false

# pandas ships no stubs by default (used only by the filesystem connector's Excel path).
[[tool.mypy.overrides]]
module = "pandas.*"
ignore_missing_imports = true

# PyYAML ships no bundled stubs; used only by the dbt codegen to emit schema.yml.
[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

# clickhouse-connect ships no py.typed marker; the client surface is dynamic and
# isolated to the ClickHouse adapter, so we treat its imports as untyped.
[[tool.mypy.overrides]]
module = "clickhouse_connect.*"
ignore_missing_imports = true

# anthropic SDK ships py.typed but some dynamic surfaces (e.g. content block
# types, usage objects) are not fully resolvable in strict mode.  The provider
# implementation is isolated to app/ai/gateway/providers/anthropic.py.
[[tool.mypy.overrides]]
module = "anthropic.*"
ignore_missing_imports = false

# periodiq ships no type information; its cron parser is used only at the worker
# entrypoint, isolated to app/reporting/.
[[tool.mypy.overrides]]
module = "periodiq.*"
ignore_missing_imports = true

# XlsxWriter ships no py.typed marker; the Workbook surface is dynamic and isolated
# to app/reporting/excel.py.
[[tool.mypy.overrides]]
module = "xlsxwriter.*"
ignore_missing_imports = true

# Observability SDKs: the OpenTelemetry instrumentation packages and the Dramatiq
# Prometheus middleware are dynamically typed / partially stubbed. Their use is
# isolated to app/core/{metrics,tracing,observability}.py and app/reporting/observability.py.
[[tool.mypy.overrides]]
module = [
    "opentelemetry.*",
    "prometheus_client.*",
    "dramatiq.middleware.prometheus.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
