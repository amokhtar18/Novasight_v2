# Single-origin server: serves the built SPA and reverse-proxies /api to the API
# service. Keeping the SPA and API on one origin avoids CORS and means only one
# port is published for the whole app.

upstream novasight_api {
    # Compose/K8s service name for the API; overridable by editing the image's
    # config or fronting with another proxy. The default targets the API service.
    server api:8000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # config.js (runtime config) must never be cached, so a redeploy/restart that
    # rewrites it takes effect immediately.
    location = /config.js {
        add_header Cache-Control "no-store";
        try_files /config.js =404;
    }

    # API reverse proxy — same origin as the SPA.
    location /api/ {
        proxy_pass http://novasight_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA history-mode fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
