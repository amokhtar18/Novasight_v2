# Single-origin server: serves the built SPA and reverse-proxies /api to the API
# service. Keeping the SPA and API on one origin avoids CORS and means only one
# port is published for the whole app.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # config.js (runtime config) must never be cached, so a redeploy/restart that
    # rewrites it takes effect immediately.
    location = /config.js {
        add_header Cache-Control "no-store";
        try_files /config.js =404;
    }

    # API reverse proxy — same origin as the SPA.
    location /api/ {
        # Resolve the API service name at request time via the platform's embedded DNS
        # (Docker = 127.0.0.11; K8s injects its own), so recreating the API container
        # (new IP) doesn't strand the proxy on a stale address. A static `upstream`/
        # `server api:8000;` resolves the name ONCE at startup and caches the IP, which
        # 502s after the API is recreated until nginx is restarted. The variable in
        # proxy_pass forces per-request resolution honoring the short DNS TTL.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA history-mode fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
