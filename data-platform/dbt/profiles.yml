# Env-driven dbt connection profile — golden rule 1: NOTHING environment- or
# tenant-specific is hardcoded here. Every value is read from the environment, using
# the SAME `CLICKHOUSE__*` variables the backend reads (config-management), so dev,
# on-prem, and cloud all share one codebase and differ only in configuration.
#
# Required env (no safe default — must be supplied, like the backend settings):
#   CLICKHOUSE__HOST       serving-engine host
#   CLICKHOUSE__PASSWORD   serving-engine password (a secret; never commit a real one)
#   DBT_SCHEMA             the tenant's dbt schema == its ClickHouse database,
#                          resolved from the tenant context at invocation time.
# Optional env (safe-everywhere defaults, identical to backend config):
#   CLICKHOUSE__PORT (8123 HTTP)  CLICKHOUSE__USER (default)  DBT_THREADS (4)
#
# The `dev` target is the local/on-prem non-TLS target by definition, so `secure`
# is fixed off here; a TLS cloud deployment adds its own output, it does not reuse
# `dev`.
novasight:
  target: dev
  outputs:
    dev:
      type: clickhouse
      driver: http
      host: "{{ env_var('CLICKHOUSE__HOST') }}"
      port: "{{ env_var('CLICKHOUSE__PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE__USER', 'default') }}"
      password: "{{ env_var('CLICKHOUSE__PASSWORD') }}"
      schema: "{{ env_var('DBT_SCHEMA') }}"
      secure: false
      verify: false
      connect_timeout: 10
      send_receive_timeout: 300
      threads: "{{ env_var('DBT_THREADS', '4') | int }}"
