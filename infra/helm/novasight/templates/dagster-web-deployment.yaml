apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "novasight.fullname" . }}-dagster-web
  labels:
    {{- include "novasight.labels" . | nindent 4 }}
    app.kubernetes.io/component: dagster-web
spec:
  replicas: {{ .Values.dagster.web.replicaCount }}
  {{- if .Values.dagster.persistence.enabled }}
  # RWO instance home shared with the daemon -> singletons co-scheduled on one node.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "novasight.selectorLabels" (dict "ctx" . "component" "dagster-web") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "novasight.selectorLabels" (dict "ctx" . "component" "dagster-web") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "novasight.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: dagster-web
          image: {{ include "novasight.image" (dict "ctx" . "key" "dagster") }}
          imagePullPolicy: {{ .Values.images.dagster.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: {{ toJson .Values.dagster.web.command }}
          envFrom:
            {{- include "novasight.envFrom" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.dagster.web.containerPort }}
          {{- if .Values.dagster.persistence.enabled }}
          volumeMounts:
            - name: dagster-home
              mountPath: /opt/dagster/home
          {{- end }}
          resources:
            {{- toYaml .Values.dagster.web.resources | nindent 12 }}
      {{- if .Values.dagster.persistence.enabled }}
      volumes:
        - name: dagster-home
          persistentVolumeClaim:
            claimName: {{ include "novasight.fullname" . }}-dagster-home
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
