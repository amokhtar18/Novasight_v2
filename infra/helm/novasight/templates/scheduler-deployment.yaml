apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "novasight.fullname" . }}-scheduler
  labels:
    {{- include "novasight.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  # Singleton: a second periodiq would double-fire dispatcher heartbeats.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "novasight.selectorLabels" (dict "ctx" . "component" "scheduler") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "novasight.selectorLabels" (dict "ctx" . "component" "scheduler") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "novasight.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: scheduler
          image: {{ include "novasight.image" (dict "ctx" . "key" "backend") }}
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: {{ toJson .Values.scheduler.command }}
          envFrom:
            {{- include "novasight.envFrom" . | nindent 12 }}
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
