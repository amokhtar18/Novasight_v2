{{- if .Values.dagster.persistence.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "novasight.fullname" . }}-dagster-home
  labels:
    {{- include "novasight.labels" . | nindent 4 }}
    app.kubernetes.io/component: dagster
spec:
  accessModes:
    - {{ .Values.dagster.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.dagster.persistence.size }}
  {{- with .Values.dagster.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
