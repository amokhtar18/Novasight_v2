{{- if .Values.minio.enabled -}}
{{- $name := include "novasight.minio.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "novasight.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console
  selector:
    {{- include "novasight.selectorLabels" (dict "ctx" . "component" "minio") | nindent 4 }}
---
{{- if .Values.minio.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  labels:
    {{- include "novasight.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.minio.persistence.size }}
  {{- with .Values.minio.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "novasight.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "novasight.selectorLabels" (dict "ctx" . "component" "minio") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "novasight.selectorLabels" (dict "ctx" . "component" "minio") | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: minio
          image: {{ .Values.minio.image }}
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "novasight.secretName" . }}
                  key: OBJECT_STORE__ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "novasight.secretName" . }}
                  key: OBJECT_STORE__SECRET_KEY
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.minio.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $name }}
          {{- else }}
          emptyDir: {}
          {{- end }}
---
# One-shot bucket creation (idempotent), after MinIO is up.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-setup
  labels:
    {{- include "novasight.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio-setup
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        {{- include "novasight.selectorLabels" (dict "ctx" . "component" "minio-setup") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: {{ .Values.minio.image }}
          command:
            - /bin/sh
            - -c
            - |
              until mc alias set local http://{{ $name }}:9000 "$ACCESS_KEY" "$SECRET_KEY"; do
                echo "waiting for minio..."; sleep 3;
              done
              mc mb --ignore-existing "local/$BUCKET"
              echo "bucket ready: $BUCKET"
          env:
            - name: ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "novasight.secretName" . }}
                  key: OBJECT_STORE__ACCESS_KEY
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "novasight.secretName" . }}
                  key: OBJECT_STORE__SECRET_KEY
            - name: BUCKET
              valueFrom:
                configMapKeyRef:
                  name: {{ include "novasight.configMapName" . }}
                  key: OBJECT_STORE__BUCKET
{{- end }}
