apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "novasight.fullname" . }}-dagster-daemon
  labels:
    {{- include "novasight.labels" . | nindent 4 }}
    app.kubernetes.io/component: dagster-daemon
spec:
  # Singleton daemon (schedules, sensors, run queue).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "novasight.selectorLabels" (dict "ctx" . "component" "dagster-daemon") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "novasight.selectorLabels" (dict "ctx" . "component" "dagster-daemon") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "novasight.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.dagster.persistence.enabled }}
      # Co-schedule with the webserver: they share one RWO instance-home PVC.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "novasight.selectorLabels" (dict "ctx" . "component" "dagster-web") | nindent 18 }}
      {{- else }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
        - name: dagster-daemon
          image: {{ include "novasight.image" (dict "ctx" . "key" "dagster") }}
          imagePullPolicy: {{ .Values.images.dagster.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: {{ toJson .Values.dagster.daemon.command }}
          envFrom:
            {{- include "novasight.envFrom" . | nindent 12 }}
          {{- if .Values.dagster.persistence.enabled }}
          volumeMounts:
            - name: dagster-home
              mountPath: /opt/dagster/home
          {{- end }}
          resources:
            {{- toYaml .Values.dagster.daemon.resources | nindent 12 }}
      {{- if .Values.dagster.persistence.enabled }}
      volumes:
        - name: dagster-home
          persistentVolumeClaim:
            claimName: {{ include "novasight.fullname" . }}-dagster-home
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
