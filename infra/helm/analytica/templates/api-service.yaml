apiVersion: v1
kind: Service
metadata:
  name: {{ include "analytica.fullname" . }}-api
  labels:
    {{- include "analytica.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "analytica.selectorLabels" (dict "ctx" . "component" "api") | nindent 4 }}
