# Grafana dashboard provider — loads JSON dashboards from disk (Phase 6.4).
apiVersion: 1
providers:
  - name: novasight
    orgId: 1
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
