# Prometheus scrape config for the local Analytica stack (Phase 6.4).
# Targets are compose service names; no infra is hardcoded into the app (the app
# only EXPOSES metrics — what scrapes them is deployment config that lives here).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # FastAPI request, pipeline, and resource metrics.
  - job_name: analytica-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # Dramatiq worker job metrics (fork-safe built-in exporter on its own port).
  - job_name: analytica-worker
    static_configs:
      - targets: ["worker:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
