# Analytica — observability overlay (Phase 6.4): Prometheus + Grafana + Jaeger.
#
# Layers on top of the base infra + app overlays and (a) scrapes the API and worker
# metrics, (b) collects OTLP traces from the API and workers, and (c) serves Grafana
# dashboards. It also flips tracing ON for the app services by pointing them at Jaeger.
#
# Bring up the full stack (from the repo root):
#   docker compose --env-file .env \
#     -f infra/compose/docker-compose.yml \
#     -f infra/compose/docker-compose.app.yml \
#     -f infra/compose/docker-compose.observability.yml up -d --build
#
# UIs: Grafana http://localhost:3001  Prometheus http://localhost:9090  Jaeger http://localhost:16686

# Turn on tracing for the app services (merged into their app-overlay definitions).
x-tracing-env: &tracing-env
  OBSERVABILITY__TRACING_ENABLED: "true"
  OBSERVABILITY__OTLP_ENDPOINT: http://jaeger:4318

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA__ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  # OTLP trace backend. all-in-one accepts OTLP/HTTP on 4318 directly (no separate
  # collector needed for the local stack).
  jaeger:
    image: jaegertracing/all-in-one:1.60
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
      - "4318:4318"     # OTLP/HTTP

  # --- enable tracing on the app services (definitions come from the app overlay) ---
  api:
    environment: *tracing-env
  worker:
    environment: *tracing-env
  scheduler:
    environment: *tracing-env

volumes:
  prometheus-data:
  grafana-data:
